name: Main

on:
  schedule:
    - cron: '0 4 * * 1,2,3,4,5'
  push:
    branches:
      - main
      - releases/*
    tags:
      - v*

  pull_request:
    branches:
      - main
      - releases/*

  workflow_dispatch:
    inputs:
      skip-test:
        description: 'Skip test'
        type: choice
        required: true
        default: 'false'
        options:
          - "true"
          - "false"
      kestra-version:
        description: 'Kestra version'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  checks: write
  actions: read
  pull-requests: write
  packages: read

jobs:
  check:
    uses: kestra-io/actions/.github/workflows/plugins.yml@main
    with:
      skip-test: ${{ github.event.inputs.skip-test == 'true' }}
      generate-shadowjar: false
      skip-indexing: true
      kestra-version: ${{ github.event.inputs.kestra-version }}
    secrets: inherit

  trivy:
    # `generate-shadowjar: false` above disables the reusable workflow's Trivy scan since this
    # library ships no plugin jar; run a standalone dependency scan instead so dependabot PRs
    # still get vulnerability signal on the OpenSearch client version this repo now owns.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
